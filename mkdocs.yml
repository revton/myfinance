site_name: MyFinance Docs
site_description: Documentação do sistema de finanças pessoais
site_author: MyFinance Team
site_url: https://revton.github.io/myfinance/

repo_name: revton/myfinance
repo_url: https://github.com/revton/myfinance
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Início: index.md
  - 🗺️ Roadmap: roadmap.md
  - 🔄 Fase 2 - Detalhamento:
    - fase2/README.md
    - fase2-detalhada.md
    - Sistema de Autenticação:
      - fase2/autenticacao/especificacao-tecnica.md
      - fase2/autenticacao/modelo-dados.md
      - fase2/autenticacao/interface-usuario.md
      - fase2/autenticacao/testes-validacao.md
    - Sistema de Categorias:
      - fase2/categorias/especificacao-tecnica.md
      - fase2/categorias/modelo-dados.md
      - fase2/categorias/interface-usuario.md
      - fase2/categorias/categorias-padrao.md
      - fase2/categorias/testes-validacao.md
    - Melhorias de UX:
      - fase2/ux/dashboard.md
      - fase2/ux/filtros-avancados.md
      - fase2/ux/balance-card-fix.md
      - fase2/ux/balance-card-fix-summary.md
    - DevOps e Deploy:
      - fase2/devops/README.md
      - fase2/devops/configuracao-ambiente.md
      - fase2/devops/polimento-fase-2.md
  - Desenvolvedor: 
    - dev/index.md
    - dev/env-setup.md
    - dev/supabase-environments.md
    - dev/migration-sqlalchemy-summary.md
    - dev/autenticacao-guia-desenvolvedor.md
    - dev/categorias-guia-desenvolvedor.md
    - dev/database-migration-production.md
    - dev/glitchtip-implementation.md
    - dev/screenshots-playwright.md
    - dev/testes-cobertura.md
  - Usuário: 
      - user/index.md
      - user/polimento-fase-2.md
      - Autenticação: user/autenticacao-guia-usuario.md
      - Transações: user/transacoes-guia-usuario.md
      - Categorias: user/categorias-guia-usuario.md
  - Screenshots: screenshots/README.md
  - Deploy: deploy.md
  - Testes: local-testing.md

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
